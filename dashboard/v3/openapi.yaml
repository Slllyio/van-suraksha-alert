openapi: 3.1.0
info:
  title: JwalaNetra v2 Portal API
  version: "2.0.0"
  summary: MP Forest Fire EWS — portal backend contract (v2)
  description: |
    Parallel v2 namespace served from `dashboard/v3/serve.py`. Every 2xx response
    follows the envelope `{ data, meta, links? }`. Errors follow
    `{ error: { code, message, details? } }` with semantic HTTP status codes.

    Designed per the `api-design` skill recommendations:
      * Resource URLs, plural + kebab-case (`/division-overview`, `/viirs-fires`)
      * Correct status codes (201 Created, 404 Not Found, 422 Unprocessable Entity)
      * Cursor pagination on the heaviest endpoint (`/ignition-v17`, 2.6 k cells)
      * Standardized error shape with field-level details
      * URL path versioning (`/api/v2/*`); v1 paths remain as `/api/*`

    The v1 paths continue to serve the legacy v3 portal and must not be removed
    until that portal is retired.
servers:
  - url: http://localhost:8790
    description: Local dev (v3 backend, any client)
  - url: http://localhost:5173
    description: v4 portal via Vite proxy (`/api/*` → :8790)

paths:
  /api/v2/ignition-v17:
    get:
      summary: Paginated v17 banded alerts
      description: |
        Returns the current day's (or requested date's) ranked fire-ignition
        cells from the LightGBM × hurdle model. ~2,600 alerts per day at peak.
      parameters:
        - in: query
          name: date
          schema: { type: string, format: date }
          description: "Prediction date (YYYY-MM-DD). Defaults to latest."
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
        - in: query
          name: cursor
          schema: { type: string }
          description: "Opaque; pass meta.next_cursor from the previous page."
      responses:
        "200":
          description: Paginated alerts
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/V17Cell" }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }
                      has_next: { type: boolean }
                      next_cursor: { type: string, nullable: true }
                      prediction_date: { type: string, format: date }
                      model: { type: string }
                      generated_at: { type: string, format: date-time }
                  links:
                    $ref: "#/components/schemas/PaginationLinks"
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /api/v2/division-overview:
    get:
      summary: 87 forest divisions with alert counts + trust tiers
      responses:
        "200":
          description: Enveloped summary (data is an object, not a list)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      divisions:
                        type: array
                        items: { $ref: "#/components/schemas/DivisionSummary" }
                      total_divisions: { type: integer }
                      updated_at: { type: string, format: date-time }
                  meta:
                    type: object
                    properties: { total: { type: integer } }

  /api/v2/season-validation:
    get:
      summary: Rolling 2026 season recall × observed fires
      description: |
        Returns a **nested report object**, not a flat list.  The live server
        groups stats under `summary`, `per_day`, `per_trust_tier`, and
        `per_division`.  Clients that want a flat per-day list should read
        `data.per_day`.
      responses:
        "200":
          description: Enveloped rolling validation report
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      summary:
                        type: object
                        description: Season-wide aggregates.
                      per_day:
                        type: array
                        description: One row per day — key recall metric is `recall_any_band`.
                        items: { $ref: "#/components/schemas/ValidationRow" }
                      per_trust_tier:
                        type: object
                        description: Recall × precision broken down by HIGH/MEDIUM/LOW.
                      per_division:
                        type: array
                        description: Per-division aggregate stats.
                        items:
                          type: object
                  meta:
                    type: object
                    properties: { total: { type: integer } }

  /api/v2/validation-log:
    get:
      summary: Field validation log (operator actions vs predictions)
      responses:
        "200":
          description: Enveloped rows (impl returns `data.rows` not bare list)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      rows:
                        type: array
                        items:
                          type: object
                  meta:
                    type: object

  /api/v2/model-transparency:
    get:
      summary: Honest v17.5 metrics + feature importance + trust guidance
      responses:
        "200":
          description: Enveloped model card
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ModelTransparency" }

  /api/v2/blind-spots:
    get:
      summary: Per-division blind-spot analysis (where recall drops)
      responses:
        "200":
          description: Enveloped blind-spot report (shape may evolve)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true

  /api/v2/latest-alert:
    get:
      summary: Most recent NRT detection bundle
      responses:
        "200":
          description: Enveloped alert payload (shape may evolve)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
                  meta: { type: object, additionalProperties: true }

  /api/v2/historical-burn-density:
    get:
      summary: Heatmap-friendly historical burn density point cloud
      description: |
        Returns every cell with ≥2 fire-season VIIRS detections over 2021-2025.
        Optimized for HeatmapLayer rendering. Supports HTTP caching via ETag +
        If-None-Match → 304. No query parameters.
      responses:
        "200":
          description: Enveloped point cloud with density weights
          headers:
            ETag:
              schema: { type: string }
              description: Strong ETag for cache validation.
            Cache-Control:
              schema: { type: string }
              description: "public, max-age=3600, must-revalidate"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    properties:
                      points:
                        type: array
                        items: { $ref: "#/components/schemas/HistoricalBurnPoint" }
                  meta:
                    $ref: "#/components/schemas/HistoricalBurnDensityMeta"
        "304":
          description: Not Modified (honors If-None-Match)
        "404":
          description: Pre-baked density file missing — run scripts/build_historical_burn_priors.py
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/v2/historical-burn-priors:
    get:
      summary: Per-cell historical burn counts over 5 fire seasons (2021-2025)
      description: |
        Returns cell-level burn history: total count, seasons burned, season list.
        Default `min_seasons=3` uses pre-baked slim file (~3.7 MB / ~27k records).
        Higher thresholds filter the slim file in-memory. Supports HTTP caching.
      parameters:
        - in: query
          name: min_seasons
          schema: { type: integer, minimum: 1, maximum: 5, default: 3 }
          description: |
            Filter cells by minimum number of seasons burned (1-5). Returns 400
            `invalid_min_seasons` on non-integer, out-of-range, or repeated query
            parameter.
      responses:
        "200":
          description: Enveloped historical burn priors with metadata
          headers:
            ETag:
              schema: { type: string }
              description: Strong ETag for cache validation.
            Cache-Control:
              schema: { type: string }
              description: "public, max-age=3600, must-revalidate"
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    properties:
                      records:
                        type: array
                        items: { $ref: "#/components/schemas/HistoricalBurnPrior" }
                  meta:
                    $ref: "#/components/schemas/HistoricalBurnPriorMeta"
        "304":
          description: Not Modified (honors If-None-Match)
        "400":
          description: Invalid min_seasons parameter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Pre-baked priors file missing — run scripts/build_historical_burn_priors.py
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/v2/viirs-fires:
    get:
      summary: Forest-clipped FIRMS VIIRS active-fire detections
      description: |
        Spatial-joined to MP beat polygons; ~75 % of raw pixels excluded as
        non-forest. 1.35 M historical rows indexed by date.
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: Enveloped detection list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ViirsFire" }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      n_before_clip: { type: integer }
                      n_clipped: { type: integer }
                      latest_date: { type: string, format: date }
                      date_range:
                        type: string
                        description: |
                          Human-readable range like `"2026-04-17 to 2026-04-24"`.
                          The live server emits a string, not a `{from, to}` object.
                        example: "2026-04-17 to 2026-04-24"

  /api/v2/division-boundaries:
    get:
      summary: 87 MP forest-division MultiPolygons (dissolved from beats)
      description: |
        Compact state-level polygons, 87 features. Solves the 179 MB
        payload concern flagged by the architect review. Two resolutions
        available via the `?resolution` query parameter.
      parameters:
        - in: query
          name: resolution
          description: |
            `ultra` (default, ~8 MB, tolerance ≈ 1 km) for state overviews;
            `high` (~17 MB, tolerance ≈ 111 m) for zoom-in detail.
          schema:
            type: string
            enum: [ultra, high]
            default: ultra
      responses:
        "200":
          description: Enveloped GeoJSON FeatureCollection
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/GeoJSONFeatureCollection" }
                  meta:
                    type: object
                    properties:
                      resolution: { type: string, enum: [ultra, high] }
                      n_features: { type: integer }
                      source_bytes: { type: integer }
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /api/v2/beats-boundary:
    get:
      summary: 8,973 MP forest-beat MultiPolygons
      description: |
        **Large (~179 MB).** Prefer `/api/v2/division-boundaries` for
        state-level rendering — this endpoint is retained for future
        zoom-in / beat-level annotation workflows.
      responses:
        "200":
          description: Enveloped GeoJSON FeatureCollection
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/GeoJSONFeatureCollection" }
                  meta:
                    type: object
                    properties: { n_features: { type: integer } }
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"

  /api/v2/operational-alerts:
    get:
      summary: Decorated alerts (coverage floor + climatology applied)
      parameters:
        - in: query
          name: date
          schema: { type: string, format: date }
      responses:
        "200":
          description: Enveloped alert payload with counts + weather/calendar context
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      counts: { type: object, additionalProperties: { type: integer } }
                      weather_context: { type: object, additionalProperties: true }
                      calendar_context: { type: object, additionalProperties: true }
                      alerts:
                        type: array
                        items: { type: object, additionalProperties: true }
                  meta: { type: object, additionalProperties: true }

  /api/v2/division-briefings:
    get:
      summary: Per-division human-readable briefings
      responses:
        "200":
          description: Enveloped briefing map (keys are division names)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true

  /api/v2/field-responses:
    get:
      summary: Operator response rollup
      responses:
        "200":
          description: Enveloped summary (aggregate counts per action)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
    post:
      summary: Record an operator response to an alert
      description: |
        Canonical Create: returns 201 with a Location header pointing to the
        resource, response body uses the `{data, meta}` envelope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldResponseInput" }
      responses:
        "201":
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: Relative URI of the new response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/FieldResponse" }
                  meta:
                    type: object
                    properties:
                      created_at: { type: string, format: date-time }
        "422":
          $ref: "#/components/responses/ErrorResponse"

  /api/v2/healthz:
    get:
      summary: Liveness + cache warmup status
      responses:
        "200":
          description: Enveloped health payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ok: { type: boolean }
                      portal_uptime_s: { type: number }
                      beat_polygons_loaded: { type: boolean }
                      firms_nrt_age_hours: { type: number }
                      firms_nrt_max_date: { type: string, format: date }

components:
  responses:
    ErrorResponse:
      description: Standardized error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: "Snake-case machine code (e.g., `invalid_cursor`)"
            message:
              type: string
              description: "Human-readable explanation"
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
                  code: { type: string }

    PaginationLinks:
      type: object
      properties:
        self: { type: string }
        next: { type: string }
        prev: { type: string }
        last: { type: string }

    V17Cell:
      type: object
      required: [cell_id, lat, lon, band]
      properties:
        cell_id:
          oneOf: [{ type: string }, { type: integer }]
          example: "r0173_c0343"
        lat: { type: number, format: double }
        lon: { type: number, format: double }
        band:
          type: string
          enum: [CRITICAL, ALERT, WATCH]
        ignition_risk: { type: number, format: double }
        calibrated_risk: { type: number, format: double }
        rank: { type: number, format: double }
        stage_a_risk: { type: number, format: double }
        hawkes_lambda: { type: number, format: double }
        hawkes_n_recent_10km_7d: { type: integer }

    DivisionSummary:
      type: object
      description: |
        Live server uses field `name` as the division identifier (not `division`).
        Both are documented so clients can fall back gracefully.
      properties:
        name: { type: string, description: "Canonical field returned by the server." }
        division: { type: string, description: "Alias — not emitted by current impl, kept for older clients." }
        critical: { type: integer }
        alert: { type: integer }
        watch: { type: integer }
        beats: { type: integer }
        hawkes_lambda: { type: number }
        trust_tier:
          type: string
          enum: [HIGH, MEDIUM, LOW]

    ValidationRow:
      type: object
      description: |
        Per-day validation stat as emitted by `/api/v2/season-validation`.
        Live server uses `recall_any_band` (not `recall_pct`); both documented
        so clients can normalize.
      properties:
        date: { type: string, format: date }
        predicted: { type: integer }
        observed: { type: integer }
        caught: { type: integer }
        recall_any_band: { type: number, description: "Canonical recall field in live impl." }
        recall_pct: { type: number, description: "Alias, not emitted by current impl." }
        trust:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        notes: { type: string }

    ModelTransparency:
      type: object
      description: |
        Note: the live server returns the model tag under the field `model`
        (not `model_version`). Both names are included below for clients that
        normalize.
      properties:
        model: { type: string, example: "v17.5", description: "Canonical field returned by the server." }
        model_version: { type: string, example: "v17.5", description: "DEPRECATED alias — not emitted by current impl." }
        recall_top5_pct: { type: number }
        precision_critical_pct: { type: number }
        per_division_coverage:
          type: object
          properties:
            covered: { type: integer }
            total: { type: integer }
        feature_importance:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              gain: { type: number }
        trust_tiers:
          type: array
          items:
            type: object
            properties:
              tier: { type: string, enum: [HIGH, MEDIUM, LOW] }
              description: { type: string }
        weaknesses:
          type: array
          items: { type: string }

    ViirsFire:
      type: object
      required: [lat, lon, date]
      properties:
        lat: { type: number }
        lon: { type: number }
        date: { type: string, format: date }
        time: { type: string }
        brightness: { type: number }
        confidence: { type: string }
        satellite: { type: string }
        source: { type: string }
        division: { type: string }
        range: { type: string }
        beat: { type: string }
        frp: { type: number }

    FieldResponseInput:
      type: object
      required: [cell_id, action]
      properties:
        cell_id: { type: string }
        action:
          type: string
          enum: [dispatch, monitor, awareness]
        operator: { type: string }
        notes: { type: string }

    FieldResponse:
      allOf:
        - $ref: "#/components/schemas/FieldResponseInput"
        - type: object
          properties:
            id: { type: string }
            created_at: { type: string, format: date-time }

    HistoricalBurnPoint:
      type: object
      required: [lat, lon, w]
      description: Single point for the burn-density HeatmapLayer.
      properties:
        lat: { type: number, format: double, description: "Latitude (WGS84)" }
        lon: { type: number, format: double, description: "Longitude (WGS84)" }
        w:   { type: integer, description: "Weight: total fire-season VIIRS detections over 5 years" }

    HistoricalBurnDensityMeta:
      type: object
      required: [seasons, filter, n_points, source_file]
      properties:
        seasons:
          type: array
          items: { type: integer }
          description: Fire seasons included
          example: [2021, 2022, 2023, 2024, 2025]
        filter:
          type: string
          example: "total_fires_5y >= 2"
        n_points: { type: integer }
        source_file: { type: string }

    HistoricalBurnPrior:
      type: object
      required: [cell_id, lat, lon, total_fires_5y, n_seasons_burned, seasons_burned]
      description: Per-cell historical burn record over the last 5 fire seasons.
      properties:
        cell_id: { type: string, example: "r0118_c0175" }
        lat:     { type: number, format: double }
        lon:     { type: number, format: double }
        total_fires_5y: { type: integer, description: "Total fire-season VIIRS detections across 5 years" }
        n_seasons_burned:
          type: integer
          minimum: 1
          maximum: 5
          description: "Number of seasons (out of 5) in which the cell burned"
        seasons_burned:
          type: array
          items: { type: integer }
          description: "Years that experienced fire — subset of [2021, 2022, 2023, 2024, 2025]"
          example: [2021, 2023, 2024]

    HistoricalBurnPriorMeta:
      type: object
      required: [seasons, served_min_seasons, served_records, source_file]
      properties:
        seasons:
          type: array
          items: { type: integer }
        served_min_seasons:
          type: integer
          description: "min_seasons threshold applied (from query param, default 3)"
        served_records:
          type: integer
          description: "Count of records returned"
        source_file:
          type: string
          description: "Filename of the source data (e.g. historical_burn_priors_3plus.json)"
        n_cells_3plus_seasons:
          type: integer
          description: "Optional: total cells with ≥3 seasons burned in the source dataset"
        n_cells_5_seasons:
          type: integer
          description: "Optional: total cells that burned in all 5 seasons"

    GeoJSONFeatureCollection:
      type: object
      properties:
        type: { type: string, enum: [FeatureCollection] }
        features:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [Feature] }
              properties:
                type: object
                properties:
                  Division: { type: string }
                  Range: { type: string }
                  Beat: { type: string }
              geometry:
                type: object
                description: |
                  RFC 7946 GeoJSON geometry. Typed as open object so
                  `openapi-typescript` emits `Record<string, unknown>` rather
                  than the restrictive `Record<string, never>`.
                additionalProperties: true
