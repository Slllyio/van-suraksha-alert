<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JwalaNetra v3 — Fire Intelligence Portal</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #0f1117; --surface: #1a1d27; --surface2: #252836;
  --text: #e4e6eb; --text-dim: #8b8fa3; --accent: #3b82f6;
  --critical: #dc2626; --alert: #ea580c; --watch: #eab308;
  --success: #22c55e; --border: #2d3142;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; }
.header { display:flex; align-items:center; justify-content:space-between; padding:8px 20px; background:var(--surface); border-bottom:1px solid var(--border); height:48px; }
.header h1 { font-size:16px; font-weight:600; }
.header h1 span { color: var(--critical); }
.tabs { display:flex; gap:4px; }
.tab { padding:6px 16px; border-radius:6px; cursor:pointer; font-size:13px; color:var(--text-dim); background:transparent; border:none; transition:all .2s; }
.tab:hover { background:var(--surface2); color:var(--text); }
.tab.active { background:var(--accent); color:white; }
.main { display:flex; height:calc(100vh - 48px); }
.tab-content { display:none; width:100%; height:100%; }
.tab-content.active { display:flex; }
.sidebar { width:300px; background:var(--surface); border-right:1px solid var(--border); padding:16px; overflow-y:auto; flex-shrink:0; }
.sidebar h3 { font-size:13px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin:16px 0 8px; }
.sidebar h3:first-child { margin-top:0; }
.stat-row { display:flex; justify-content:space-between; padding:6px 0; font-size:14px; }
.stat-val { font-weight:600; }
.band-badge { display:inline-block; padding:2px 10px; border-radius:10px; font-size:12px; font-weight:600; }
.band-CRITICAL { background:var(--critical); color:white; }
.band-ALERT { background:var(--alert); color:white; }
.band-WATCH { background:var(--watch); color:#1a1a1a; }
.confidence-badge { padding:4px 12px; border-radius:6px; font-size:12px; font-weight:600; display:inline-block; margin-top:4px; }
.conf-HIGH { background:#166534; color:#86efac; }
.conf-MEDIUM { background:#854d0e; color:#fde047; }
.conf-LOW { background:#991b1b; color:#fca5a5; }
#map { flex:1; }
.detail-panel { width:340px; background:var(--surface); border-left:1px solid var(--border); padding:16px; overflow-y:auto; display:none; flex-shrink:0; }
.detail-panel.open { display:block; }
.detail-panel h2 { font-size:15px; margin-bottom:12px; }
.detail-close { float:right; cursor:pointer; color:var(--text-dim); font-size:18px; }
.division-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:16px; padding:20px; overflow-y:auto; width:100%; }
.div-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; cursor:pointer; transition:all .2s; }
.div-card:hover { border-color:var(--accent); transform:translateY(-2px); }
.div-card h3 { font-size:15px; margin-bottom:8px; }
.div-card .counts { display:flex; gap:8px; margin:8px 0; flex-wrap:wrap; }
.transparency { padding:24px 40px; overflow-y:auto; width:100%; max-width:900px; margin:0 auto; }
.transparency h2 { font-size:20px; margin:24px 0 12px; }
.transparency h2:first-child { margin-top:0; }
.metric-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin:16px 0; }
.metric-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:14px; text-align:center; }
.metric-card .value { font-size:24px; font-weight:700; margin:4px 0; }
.metric-card .label { font-size:12px; color:var(--text-dim); }
.metric-card .subtext { font-size:11px; color:var(--text-dim); margin-top:4px; }
.trust-box { background:var(--surface2); border-radius:8px; padding:14px; margin:8px 0; border-left:4px solid; }
.trust-high { border-color:var(--success); }
.trust-medium { border-color:var(--watch); }
.trust-low { border-color:var(--critical); }
.fi-bar { display:flex; align-items:center; margin:4px 0; }
.fi-bar .name { width:180px; font-size:12px; color:var(--text-dim); }
.fi-bar .bar { height:20px; border-radius:3px; min-width:2px; }
.fi-bar .val { font-size:11px; color:var(--text-dim); margin-left:8px; }
.validation { padding:24px 40px; overflow-y:auto; width:100%; max-width:900px; margin:0 auto; }
table { width:100%; border-collapse:collapse; margin:16px 0; }
th,td { padding:8px 12px; text-align:left; border-bottom:1px solid var(--border); font-size:13px; }
th { color:var(--text-dim); font-size:12px; text-transform:uppercase; }
</style>
</head>
<body>

<div class="header">
  <h1>JwalaNetra &mdash; Fire Intelligence Portal</h1>
  <div class="tabs">
    <button class="tab active" data-tab="map">Live Map</button>
    <button class="tab" data-tab="divisions">Divisions</button>
    <button class="tab" data-tab="transparency">Model Card</button>
    <button class="tab" data-tab="validation">Validation</button>
  </div>
  <div style="font-size:12px; color:var(--text-dim)">v17 Production | <span id="pred-date"></span></div>
</div>

<div class="main">
  <div id="tab-map" class="tab-content active">
    <div class="sidebar" id="sidebar">
      <h3>Alert Summary</h3>
      <div class="stat-row"><span>CRITICAL</span><span class="stat-val band-badge band-CRITICAL" id="n-critical"></span></div>
      <div class="stat-row"><span>ALERT</span><span class="stat-val band-badge band-ALERT" id="n-alert"></span></div>
      <div class="stat-row"><span>WATCH</span><span class="stat-val band-badge band-WATCH" id="n-watch"></span></div>
      <h3>Model Confidence</h3>
      <div id="confidence-indicator"></div>
      <p style="font-size:11px; color:var(--text-dim); margin-top:6px">Based on Hawkes fire-neighborhood coverage</p>
      <h3>Active Fires (FIRMS)</h3>
      <div class="stat-row"><span>Last 24h</span><span class="stat-val" id="firms-count"></span></div>
    </div>
    <div id="map"></div>
    <div class="detail-panel" id="detail-panel">
      <span class="detail-close" id="detail-close">x</span>
      <h2 id="detail-title">Cell Detail</h2>
      <div id="detail-body"></div>
    </div>
  </div>

  <div id="tab-divisions" class="tab-content">
    <div class="division-grid" id="division-grid"></div>
  </div>

  <div id="tab-transparency" class="tab-content">
    <div class="transparency" id="transparency-content"></div>
  </div>

  <div id="tab-validation" class="tab-content">
    <div class="validation" id="validation-content"></div>
  </div>
</div>

<script>
const state = { map: null, v17: null };

// Tab switching
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', function() {
    const name = this.dataset.tab;
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    this.classList.add('active');
    if (name === 'map' && state.map) state.map.resize();
    if (name === 'divisions') loadDivisions();
    if (name === 'transparency') loadTransparency();
    if (name === 'validation') loadValidation();
  });
});

document.getElementById('detail-close').addEventListener('click', function() {
  document.getElementById('detail-panel').classList.remove('open');
});

// MAP
async function initMap() {
  state.map = new maplibregl.Map({
    container: 'map',
    style: { version: 8, sources: { osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256 }}, layers: [{ id: 'osm', type: 'raster', source: 'osm' }] },
    center: [78.5, 23.5], zoom: 6.5,
  });
  state.map.addControl(new maplibregl.NavigationControl(), 'top-right');

  state.map.on('load', async function() {
    state.map.addSource('v17', { type: 'geojson', data: { type: 'FeatureCollection', features: [] }});
    state.map.addLayer({
      id: 'v17-layer', type: 'circle', source: 'v17',
      paint: {
        'circle-radius': ['match', ['get','band'], 'CRITICAL',8, 'ALERT',6, 'WATCH',4, 3],
        'circle-color': ['match', ['get','band'], 'CRITICAL','#dc2626', 'ALERT','#ea580c', 'WATCH','#eab308', '#6b7280'],
        'circle-opacity': ['match', ['get','band'], 'CRITICAL',0.9, 'ALERT',0.7, 'WATCH',0.4, 0.3],
        'circle-stroke-width': 1, 'circle-stroke-color': '#000',
      }
    });

    state.map.on('click', 'v17-layer', function(e) { showDetail(e.features[0].properties); });
    state.map.on('mouseenter', 'v17-layer', function() { state.map.getCanvas().style.cursor = 'pointer'; });
    state.map.on('mouseleave', 'v17-layer', function() { state.map.getCanvas().style.cursor = ''; });

    await loadV17Data();
  });
}

async function loadV17Data() {
  const res = await fetch('/api/ignition-v17');
  state.v17 = await res.json();
  if (state.v17.error) return;

  document.getElementById('pred-date').textContent = state.v17.prediction_date || '';
  const alerts = state.v17.banded_alerts || [];
  const counts = { CRITICAL: 0, ALERT: 0, WATCH: 0 };
  let hawkesHigh = 0;

  const features = alerts.map(function(a) {
    counts[a.band] = (counts[a.band] || 0) + 1;
    if ((a.hawkes_n_recent_10km_7d || 0) > 1) hawkesHigh++;
    return { type: 'Feature', geometry: { type: 'Point', coordinates: [a.lon, a.lat] },
             properties: Object.assign({}, a, { ignition_risk: (a.ignition_risk || 0).toFixed(4) }) };
  });

  state.map.getSource('v17').setData({ type: 'FeatureCollection', features: features });
  document.getElementById('n-critical').textContent = counts.CRITICAL;
  document.getElementById('n-alert').textContent = counts.ALERT;
  document.getElementById('n-watch').textContent = counts.WATCH;

  var pct = alerts.length ? Math.round(hawkesHigh / alerts.length * 100) : 0;
  var conf = pct > 50 ? 'HIGH' : pct > 30 ? 'MEDIUM' : 'LOW';
  var el = document.getElementById('confidence-indicator');
  var badge = document.createElement('span');
  badge.className = 'confidence-badge conf-' + conf;
  badge.textContent = conf + ' (' + pct + '% Hawkes-supported)';
  el.textContent = '';
  el.appendChild(badge);
}

function showDetail(props) {
  var panel = document.getElementById('detail-panel');
  panel.classList.add('open');
  document.getElementById('detail-title').textContent = props.cell_id || 'Cell';
  var hawkes = Number(props.hawkes_n_recent_10km_7d || 0);
  var trust = hawkes >= 3 ? 'HIGH' : hawkes >= 1 ? 'MEDIUM' : 'LOW';
  var body = document.getElementById('detail-body');

  while (body.firstChild) body.removeChild(body.firstChild);

  var items = [
    ['Band', props.band, 'band-badge band-' + props.band],
    ['Risk Score', Number(props.ignition_risk).toFixed(4)],
    ['Rank', (Number(props.rank) * 100).toFixed(1) + '%'],
    ['Location', Number(props.lat).toFixed(3) + ', ' + Number(props.lon).toFixed(3)],
  ];
  items.forEach(function(item) {
    var row = document.createElement('div');
    row.className = 'stat-row';
    var label = document.createElement('span');
    label.textContent = item[0];
    var val = document.createElement('span');
    val.className = item[2] ? item[2] : 'stat-val';
    val.textContent = item[1];
    row.appendChild(label);
    row.appendChild(val);
    body.appendChild(row);
  });

  var h3 = document.createElement('h3');
  h3.style.cssText = 'margin-top:16px; font-size:13px; color:var(--text-dim)';
  h3.textContent = 'HAWKES CONTEXT';
  body.appendChild(h3);

  var hawkesItems = [
    ['Recent fires (10km, 7d)', String(hawkes)],
    ['Hawkes lambda', Number(props.hawkes_lambda || 0).toFixed(4)],
  ];
  hawkesItems.forEach(function(item) {
    var row = document.createElement('div');
    row.className = 'stat-row';
    var l = document.createElement('span'); l.textContent = item[0];
    var v = document.createElement('span'); v.className = 'stat-val'; v.textContent = item[1];
    row.appendChild(l); row.appendChild(v); body.appendChild(row);
  });

  var trustBadge = document.createElement('div');
  trustBadge.className = 'stat-row';
  var tl = document.createElement('span'); tl.textContent = 'Trust Level';
  var tb = document.createElement('span'); tb.className = 'confidence-badge conf-' + trust; tb.textContent = trust;
  trustBadge.appendChild(tl); trustBadge.appendChild(tb); body.appendChild(trustBadge);

  var recH3 = document.createElement('h3');
  recH3.style.cssText = 'margin-top:16px; font-size:13px; color:var(--text-dim)';
  recH3.textContent = 'PATROL RECOMMENDATION';
  body.appendChild(recH3);

  var rec = document.createElement('p');
  rec.style.cssText = 'font-size:14px; margin-top:8px; line-height:1.5';
  if (trust === 'HIGH') rec.textContent = 'DISPATCH PRIORITY. Fire contagion active nearby \u2014 high probability of spread to this cell.';
  else if (trust === 'MEDIUM') rec.textContent = 'SCHEDULED PATROL. Some fire activity nearby. Monitor weather conditions.';
  else rec.textContent = 'LOW CONFIDENCE ALERT. No recent fires in area. Alert based on weather + vegetation only \u2014 treat as awareness, not dispatch.';
  body.appendChild(rec);
}

// DIVISIONS
async function loadDivisions() {
  var res = await fetch('/api/division-overview');
  var data = await res.json();
  var grid = document.getElementById('division-grid');
  while (grid.firstChild) grid.removeChild(grid.firstChild);

  if (!data.divisions || !data.divisions.length) {
    var p = document.createElement('p');
    p.style.cssText = 'padding:40px; color:var(--text-dim)';
    p.textContent = 'No division data available';
    grid.appendChild(p);
    return;
  }

  data.divisions.forEach(function(d) {
    var card = document.createElement('div');
    card.className = 'div-card';
    card.addEventListener('click', function() {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.tab')[0].classList.add('active');
      document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
      document.getElementById('tab-map').classList.add('active');
      state.map.resize();
      state.map.flyTo({ center: [d.center_lon, d.center_lat], zoom: 9 });
    });

    var h3 = document.createElement('h3'); h3.textContent = d.name; card.appendChild(h3);

    var counts = document.createElement('div'); counts.className = 'counts';
    if (d.critical) { var b = document.createElement('span'); b.className = 'band-badge band-CRITICAL'; b.textContent = d.critical + ' CRIT'; counts.appendChild(b); }
    if (d.alert) { var b = document.createElement('span'); b.className = 'band-badge band-ALERT'; b.textContent = d.alert + ' ALERT'; counts.appendChild(b); }
    if (d.watch) { var b = document.createElement('span'); b.className = 'band-badge band-WATCH'; b.textContent = d.watch + ' WATCH'; counts.appendChild(b); }
    card.appendChild(counts);

    var risk = document.createElement('div'); risk.className = 'stat-row';
    var rl = document.createElement('span'); rl.textContent = 'Max risk';
    var rv = document.createElement('span'); rv.className = 'stat-val'; rv.textContent = d.max_risk.toFixed(3);
    risk.appendChild(rl); risk.appendChild(rv); card.appendChild(risk);

    var haw = document.createElement('div'); haw.className = 'stat-row';
    var hl = document.createElement('span'); hl.textContent = 'Hawkes coverage';
    var hv = document.createElement('span'); hv.className = 'stat-val'; hv.textContent = d.hawkes_high_pct + '%';
    haw.appendChild(hl); haw.appendChild(hv); card.appendChild(haw);

    var cb = document.createElement('span'); cb.className = 'confidence-badge conf-' + d.confidence; cb.textContent = d.confidence + ' confidence';
    card.appendChild(cb);
    grid.appendChild(card);
  });
}

// TRANSPARENCY
async function loadTransparency() {
  var res = await fetch('/api/model-transparency');
  var d = await res.json();
  var m = d.metrics || {};
  var h = d.hawkes_dependency || {};
  var tg = d.trust_guidance || {};
  var fi = d.top_features || [];
  var maxGain = fi.length ? fi[0].gain : 1;
  var colors = { Hawkes:'#3b82f6', 'Land cover':'#22c55e', Anthropogenic:'#f59e0b',
                 Terrain:'#8b5cf6', Temporal:'#ec4899', Hydro:'#06b6d4', Vegetation:'#84cc16' };

  var container = document.getElementById('transparency-content');
  while (container.firstChild) container.removeChild(container.firstChild);

  function addH2(text) { var h2 = document.createElement('h2'); h2.textContent = text; container.appendChild(h2); }
  function addP(text) { var p = document.createElement('p'); p.style.cssText = 'color:var(--text-dim); line-height:1.6; margin:8px 0'; p.textContent = text; container.appendChild(p); }

  addH2('v17 Model Performance');
  var mg = document.createElement('div'); mg.className = 'metric-grid';
  [
    ['CRITICAL Precision', '22%', '1 in 5 CRITICALs is a real fire', '--success'],
    ['Recall @ Top 5%', (m.recall_top5pct_tiered*100).toFixed(1)+'%', 'Catches ~half of fires in patrol list', '--accent'],
    ['ROC-AUC', String(m.roc_auc), 'Overall ranking quality', '--text'],
  ].forEach(function(item) {
    var mc = document.createElement('div'); mc.className = 'metric-card';
    var lab = document.createElement('div'); lab.className = 'label'; lab.textContent = item[0]; mc.appendChild(lab);
    var val = document.createElement('div'); val.className = 'value'; val.style.color = 'var('+item[3]+')'; val.textContent = item[1]; mc.appendChild(val);
    var sub = document.createElement('div'); sub.className = 'subtext'; sub.textContent = item[2]; mc.appendChild(sub);
    mg.appendChild(mc);
  });
  container.appendChild(mg);

  addH2('Known Weakness: New-Outbreak Prediction');
  var mg2 = document.createElement('div'); mg2.className = 'metric-grid';
  [
    ['Low-Hawkes Recall', (h.low_hawkes_recall*100).toFixed(1)+'%', 'Model fails where no recent fires', '--critical'],
    ['High-Hawkes Recall', (h.high_hawkes_recall*100).toFixed(1)+'%', 'Works near active fire zones', '--success'],
    ['% Fires in Quiet Areas', (h.low_hawkes_pct_of_ignitions*100).toFixed(0)+'%', 'Most fires start where model weakest', '--watch'],
  ].forEach(function(item) {
    var mc = document.createElement('div'); mc.className = 'metric-card';
    var lab = document.createElement('div'); lab.className = 'label'; lab.textContent = item[0]; mc.appendChild(lab);
    var val = document.createElement('div'); val.className = 'value'; val.style.color = 'var('+item[3]+')'; val.textContent = item[1]; mc.appendChild(val);
    var sub = document.createElement('div'); sub.className = 'subtext'; sub.textContent = item[2]; mc.appendChild(sub);
    mg2.appendChild(mc);
  });
  container.appendChild(mg2);

  addH2('When to Trust the Model');
  [['trust-high', 'TRUST HIGH: ' + tg.trust_high], ['trust-medium', 'TRUST MEDIUM: ' + tg.trust_medium], ['trust-low', 'TRUST LOW: ' + tg.trust_low]].forEach(function(item) {
    var box = document.createElement('div'); box.className = 'trust-box ' + item[0]; box.textContent = item[1]; container.appendChild(box);
  });

  addH2('Top Prediction Drivers');
  fi.forEach(function(f) {
    var row = document.createElement('div'); row.className = 'fi-bar';
    var name = document.createElement('span'); name.className = 'name'; name.textContent = f.name.replace(/_/g, ' '); row.appendChild(name);
    var bar = document.createElement('div'); bar.className = 'bar'; bar.style.width = (f.gain/maxGain*300)+'px'; bar.style.background = colors[f.family]||'#666'; row.appendChild(bar);
    var val = document.createElement('span'); val.className = 'val'; val.textContent = f.family; row.appendChild(val);
    container.appendChild(row);
  });
  addP('Hawkes self-excitation (nearby fire history) dominates at 18x the importance of any other feature. This is why the model excels at fire contagion but struggles with new outbreaks.');
}

// VALIDATION
async function loadValidation() {
  var res = await fetch('/api/validation-log');
  var data = await res.json();
  var rows = data.rows || [];
  var container = document.getElementById('validation-content');
  while (container.firstChild) container.removeChild(container.firstChild);

  var h2 = document.createElement('h2'); h2.textContent = 'Field Validation Log'; container.appendChild(h2);
  var p = document.createElement('p'); p.style.cssText = 'color:var(--text-dim); margin-bottom:16px';
  p.textContent = 'Each row compares v17 predictions on date D against actual FIRMS ignitions in [D, D+7]. Updated daily.';
  container.appendChild(p);

  if (rows.length === 0) {
    var np = document.createElement('p'); np.style.color = 'var(--text-dim)';
    np.textContent = 'No validation data yet. Accumulates as the daily pipeline runs during fire season.';
    container.appendChild(np);
  } else {
    var table = document.createElement('table');
    var thead = document.createElement('thead'); var hr = document.createElement('tr');
    ['Date','Top-5%','Actual Fires','Catches','Recall','CRIT Hits','CRIT Prec'].forEach(function(h) {
      var th = document.createElement('th'); th.textContent = h; hr.appendChild(th);
    });
    thead.appendChild(hr); table.appendChild(thead);
    var tbody = document.createElement('tbody');
    rows.forEach(function(r) {
      var tr = document.createElement('tr');
      [r.prediction_date, r.n_top5pct, r.n_actual_ignitions_d_to_d7, r.n_catches_in_top5pct,
       r.observed_recall_top5pct || '\u2014', r.n_critical_hits,
       (r.observed_precision_critical * 100).toFixed(1) + '%'].forEach(function(v) {
        var td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody); container.appendChild(table);
  }
}

initMap();
</script>
</body>
</html>
