<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VanAagni Command Horizon v2</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">

<!-- MapLibre GL JS -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<!-- CesiumJS library and CSS -->
<script src="https://cesium.com/downloads/cesiumjs/releases/1.110/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.110/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

<!-- deck.gl standalone -->
<script src="https://unpkg.com/deck.gl@9.0.16/dist.min.js"></script>

<!-- Turf.js for spatial ops -->
<script src="https://unpkg.com/@turf/turf@7.1.0/turf.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ─── CSS Variables ─── */
:root {
  --bg-primary: #0a0e17;
  --bg-secondary: #111827;
  --bg-card: rgba(17, 24, 39, 0.75);
  --bg-glass: rgba(17, 24, 39, 0.55);
  --border-glass: rgba(255, 255, 255, 0.08);
  --border-active: rgba(251, 146, 60, 0.4);
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent-fire: #f97316;
  --accent-danger: #ef4444;
  --accent-warn: #eab308;
  --accent-safe: #22c55e;
  --accent-info: #3b82f6;
  --accent-purple: #a855f7;
  --glass-blur: 16px;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow-glow: 0 0 30px rgba(249, 115, 22, 0.15);
  --font-sans: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

#map, #cesiumContainer {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 0;
}

#cesiumContainer {
  display: none;
}

.glass {
  background: var(--bg-glass);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border: 1px solid var(--border-glass);
  border-radius: var(--radius);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

.top-bar {
  position: fixed;
  top: 12px; left: 12px; right: 12px;
  height: 56px;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
}

.brand { display: flex; align-items: center; gap: 12px; }

.brand-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #f97316, #ef4444);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  box-shadow: 0 0 20px rgba(249, 115, 22, 0.3);
}

.brand-text { font-weight: 700; font-size: 18px; letter-spacing: -0.5px; }
.brand-text span { color: var(--accent-fire); }
.brand-sub { font-size: 11px; color: var(--text-muted); font-weight: 400; letter-spacing: 1.5px; text-transform: uppercase; }

.top-actions { display: flex; align-items: center; gap: 8px; }

.status-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500;
  background: rgba(34, 197, 94, 0.12); border: 1px solid rgba(34, 197, 94, 0.25); color: var(--accent-safe);
}

.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-safe); animation: pulse-dot 2s infinite; }
@keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.time-display {
  font-family: var(--font-mono); font-size: 13px; color: var(--text-secondary);
  padding: 6px 14px; border-radius: 20px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border-glass);
}

.sidebar-left {
  position: fixed; top: 80px; left: 12px; bottom: 12px; width: 320px; z-index: 90;
  display: flex; flex-direction: column; gap: 10px;
  overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;
}

.threat-card { padding: 16px; position: relative; overflow: hidden; }
.threat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent-fire), var(--accent-danger)); }
.threat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.threat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); font-weight: 600; }
.threat-level { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
.threat-level.critical { color: var(--accent-danger); }
.threat-level.high { color: var(--accent-fire); }
.threat-level.moderate { color: var(--accent-warn); }
.threat-level.low { color: var(--accent-safe); }

.fwi-card { padding: 16px; }
.fwi-gauge { position: relative; width: 100%; height: 14px; background: rgba(255,255,255,0.05); border-radius: 7px; overflow: hidden; margin: 12px 0 8px; }
.fwi-fill { height: 100%; border-radius: 7px; transition: width 1s ease; background: linear-gradient(90deg, #22c55e, #eab308, #f97316, #ef4444, #7f1d1d); }
.fwi-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-muted); }

.layers-card { padding: 16px; }
.section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); font-weight: 600; margin-bottom: 10px; }

.sidebar-right { position: fixed; top: 80px; right: 12px; bottom: 12px; width: 360px; z-index: 90; display: flex; flex-direction: column; gap: 10px; }

.alert-feed { flex: 1; padding: 16px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }

.twin-hud {
    position: fixed; top: 80px; left: 344px; width: 300px; padding: 15px; display: none; z-index: 100;
}
.twin-hud.visible { display: block; }
.twin-btn-group { display: flex; gap: 5px; margin-top: 10px; }
.twin-btn {
    flex: 1; background: #444; color: white; border: 1px solid #666; padding: 8px; border-radius: 4px;
    cursor: pointer; font-size: 0.8rem; font-weight: bold;
}
.twin-btn.active { background: var(--accent-danger); border-color: var(--accent-danger); }

.map-controls { position: fixed; bottom: 104px; right: 384px; z-index: 90; display: flex; flex-direction: column; gap: 4px; }
.map-ctrl-btn {
  width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 16px; color: var(--text-secondary); transition: all 0.2s;
}
.map-ctrl-btn:hover { color: var(--text-primary); background: rgba(255,255,255,0.08); }
.map-ctrl-btn.active { color: var(--accent-fire); background: rgba(249, 115, 22, 0.12); }

.loading-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg-primary); z-index: 1000;
  display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s;
}
.loading-overlay.hidden { opacity: 0; pointer-events: none; }
.loading-spinner { width: 48px; height: 48px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent-fire); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">Initializing VanAagni Level 4 Twin...</div>
</div>

<div class="top-bar glass">
  <div class="brand">
    <div class="brand-icon">&#x1f525;</div>
    <div>
      <div class="brand-text">Van<span>Aagni</span></div>
      <div class="brand-sub">Command Horizon v2</div>
    </div>
  </div>
  <div class="top-actions">
    <div class="status-pill">
      <div class="status-dot"></div>
      <span id="systemStatus">Level 4 Autonomous</span>
    </div>
    <div class="time-display" id="liveTime"></div>
  </div>
</div>

<div id="map"></div>
<div id="cesiumContainer"></div>

<div class="twin-hud glass" id="twinHud">
    <div class="section-title">🔥 3D Digital Twin Command</div>
    <div style="font-size: 0.8rem; margin-bottom: 8px;">
        Simulation Time: <span id="sim-time" style="color:var(--accent-info); font-weight:bold;">00:00</span><br>
        Status: <span id="twin-status" style="color:var(--accent-safe);">Engine Ready</span>
    </div>
    <div class="twin-btn-group">
        <button class="twin-btn" id="toggleSimBtn" onclick="toggleTwinSimulation()">START SIM</button>
        <button class="twin-btn" id="lineBtn" onclick="setTwinIntervention('FIRELINE')">LINE</button>
        <button class="twin-btn" id="igniteBtn" onclick="setTwinIntervention('BACKFIRE')">IGNITE</button>
    </div>
    <button style="margin-top:5px; width:100%; background:#2c3e50; color:white; border:none; padding:5px; border-radius:4px;" onclick="clearTwinInterventions()">CLEAR ALL</button>
</div>

<div class="sidebar-left">
  <div class="threat-card glass">
    <div class="threat-header">
      <div class="threat-label">Current Threat Level</div>
      <div class="threat-level moderate" id="threatLevel">MODERATE</div>
    </div>
  </div>

  <div class="fwi-card glass">
    <div class="section-title">Fire Weather Index</div>
    <div class="fwi-gauge"><div class="fwi-fill" id="fwiFill" style="width: 65%"></div></div>
    <div class="fwi-labels"><span>Low</span><span>Extreme</span></div>
  </div>

  <div class="layers-card glass">
    <div class="section-title">Map Controls</div>
    <div id="layerToggles"></div>
  </div>
</div>

<div class="sidebar-right" id="sidebarRight">
  <div class="alert-feed glass">
    <div class="section-title">Tactical Alert Feed</div>
    <div id="alertList"></div>
  </div>
</div>

<div class="map-controls glass">
  <div class="map-ctrl-btn" id="btnZoomIn">+</div>
  <div class="map-ctrl-btn" id="btnZoomOut">&minus;</div>
  <div class="map-ctrl-btn" id="btn3D" title="3D War Room Mode">&#x26f0;</div>
</div>

<script>
const CONFIG = {
  center: [77.32, 24.64],
  zoom: 10,
  realDataUrl: '/api/real-data',
  mapStyles: { dark: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json' }
};

const state = {
  map: null, cesium: null, isTwinMode: false, isSimulating: false, socket: null,
  fireCoordinates: [], interventions: [], currentInterType: null
};

async function init() {
  updateClock();
  setInterval(updateClock, 1000);

  // 1. Initialize MapLibre (2D Mode)
  state.map = new maplibregl.Map({
    container: 'map', style: CONFIG.mapStyles.dark,
    center: CONFIG.center, zoom: CONFIG.zoom, pitch: 0
  });

  state.map.on('load', () => {
    state.map.addSource('fires', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    state.map.addLayer({
      id: 'fire-layer', type: 'circle', source: 'fires',
      paint: {
        'circle-radius': 8, 'circle-color': '#f97316', 'circle-stroke-width': 2, 'circle-stroke-color': '#fff',
        'circle-opacity': 0.8
      }
    });

    // v17 ignition predictions (NEW layer, bands: CRITICAL/ALERT/WATCH)
    state.map.addSource('ignition-v17', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    state.map.addLayer({
      id: 'ignition-v17-layer', type: 'circle', source: 'ignition-v17',
      paint: {
        'circle-radius': [
          'match', ['get', 'band'],
          'CRITICAL', 10, 'ALERT', 7, 'WATCH', 4, 3
        ],
        'circle-color': [
          'match', ['get', 'band'],
          'CRITICAL', '#dc2626', 'ALERT', '#ea580c', 'WATCH', '#facc15', '#9ca3af'
        ],
        'circle-opacity': [
          'match', ['get', 'band'],
          'CRITICAL', 0.85, 'ALERT', 0.65, 'WATCH', 0.4, 0.3
        ],
        'circle-stroke-width': 1, 'circle-stroke-color': '#1e293b'
      }
    });

    fetchRealData();
    fetchIgnitionV17();
  });

  // 2. Initialize Cesium (3D Twin Mode)
  state.cesium = new Cesium.Viewer('cesiumContainer', {
    terrainProvider: Cesium.createWorldTerrain(),
    baseLayerPicker: false, infoBox: false, animation: false, timeline: false
  });
  state.cesium.scene.globe.depthTestAgainstTerrain = true;

  setupEvents();
  setTimeout(() => document.getElementById('loadingOverlay').classList.add('hidden'), 1000);
}

async function fetchRealData() {
  try {
    const res = await fetch(CONFIG.realDataUrl);
    const data = await res.json();
    updateUI(data);
  } catch (err) {
    console.error("Failed to fetch real data", err);
  }
}

async function fetchIgnitionV17() {
  try {
    const res = await fetch('/api/ignition-v17');
    const data = await res.json();
    if (data.error) {
      console.warn('v17 ignition:', data.error);
      return;
    }
    const alerts = data.banded_alerts || [];
    const features = alerts.map(a => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [a.lon, a.lat] },
      properties: {
        cell_id: a.cell_id,
        band: a.band,
        ignition_risk: a.ignition_risk,
        rank: a.rank,
        hawkes_n_recent_10km_7d: a.hawkes_n_recent_10km_7d,
      }
    }));
    state.map.getSource('ignition-v17').setData({ type: 'FeatureCollection', features });
    console.log(`v17 ignition: ${alerts.length} alerts loaded (model=${data.model})`);

    // Hover tooltip
    const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false });
    state.map.on('mouseenter', 'ignition-v17-layer', (e) => {
      state.map.getCanvas().style.cursor = 'pointer';
      const p = e.features[0].properties;
      popup.setLngLat(e.lngLat)
        .setHTML(`<div style="font-size:11px;color:#222;">
            <b>${p.band}</b> — ${p.cell_id}<br>
            Ignition risk: ${Number(p.ignition_risk).toFixed(3)}<br>
            Rank: ${(Number(p.rank) * 100).toFixed(1)}%<br>
            Recent 10km/7d: ${p.hawkes_n_recent_10km_7d}
          </div>`)
        .addTo(state.map);
    });
    state.map.on('mouseleave', 'ignition-v17-layer', () => {
      state.map.getCanvas().style.cursor = '';
      popup.remove();
    });
  } catch (err) {
    console.error("Failed to fetch v17 ignition predictions", err);
  }
}

function updateUI(data) {
  // Update Threat Level
  const threatEl = document.getElementById('threatLevel');
  const sev = data.bulletin_severity || 'CLEAR';
  threatEl.innerText = sev;
  threatEl.className = 'threat-level ' + sev.toLowerCase();

  // Update FWI
  const fwi = data.division_fwi || { value: 0 };
  const fwiFill = document.getElementById('fwiFill');
  const fwiPct = Math.min(100, (fwi.value / 60) * 100);
  fwiFill.style.width = fwiPct + '%';

  // Update Alert Feed
  const alertList = document.getElementById('alertList');
  alertList.innerHTML = '';
  
  const beats = data.active_beats || [];
  beats.forEach(beat => {
    const card = document.createElement('div');
    card.className = 'glass';
    card.style.padding = '12px';
    card.style.marginBottom = '8px';
    card.style.borderLeft = `4px solid ${beat.fused_tier === 'CRITICAL' ? '#ef4444' : '#f97316'}`;
    card.innerHTML = `
      <div style="font-size:11px; color:#94a3b8; font-weight:600;">BEAT: ${beat.beat_id}</div>
      <div style="font-size:14px; font-weight:700; margin:4px 0;">Tier: ${beat.fused_tier}</div>
      <div style="font-size:12px; color:#64748b;">Risk Score: ${(beat.risk_score || 0).toFixed(2)}</div>
    `;
    card.onclick = () => {
      state.map.flyTo({ center: [beat.centroid_lon, beat.centroid_lat], zoom: 13 });
    };
    alertList.appendChild(card);
  });

  // Update Map Markers
  const features = beats.map(b => ({
    type: 'Feature',
    geometry: { type: 'Point', coordinates: [b.centroid_lon, b.centroid_lat] },
    properties: { id: b.beat_id, tier: b.fused_tier }
  }));
  state.map.getSource('fires').setData({ type: 'FeatureCollection', features });
}

function setupEvents() {
  document.getElementById('btn3D').addEventListener('click', toggleTwinMode);
  document.getElementById('btnZoomIn').addEventListener('click', () => state.map.zoomIn());
  document.getElementById('btnZoomOut').addEventListener('click', () => state.map.zoomOut());

  // Cesium Click Handler for Interventions
  const handler = new Cesium.ScreenSpaceEventHandler(state.cesium.scene.canvas);
  handler.setInputAction((click) => {
    if (!state.currentInterType || !state.isTwinMode) return;
    const cartesian = state.cesium.scene.pickPosition(click.position);
    if (Cesium.defined(cartesian)) {
        const cartographic = Cesium.Cartographic.fromCartesian(cartesian);
        const lon = Cesium.Math.toDegrees(cartographic.longitude);
        const lat = Cesium.Math.toDegrees(cartographic.latitude);
        state.interventions.push({ type: state.currentInterType, geometry: { type: "Point", coordinates: [lon, lat] } });
        state.cesium.entities.add({
            name: 'Intervention', position: cartesian,
            point: { pixelSize: 10, color: state.currentInterType === 'FIRELINE' ? Cesium.Color.YELLOW : Cesium.Color.RED, heightReference: Cesium.HeightReference.CLAMP_TO_GROUND }
        });
    }
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
}

function toggleTwinMode() {
  state.isTwinMode = !state.isTwinMode;
  const mapEl = document.getElementById('map');
  const cesiumEl = document.getElementById('cesiumContainer');
  const hudEl = document.getElementById('twinHud');
  const btn = document.getElementById('btn3D');

  if (state.isTwinMode) {
    mapEl.style.display = 'none';
    cesiumEl.style.display = 'block';
    hudEl.classList.add('visible');
    btn.classList.add('active');
    state.cesium.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(CONFIG.center[0], CONFIG.center[1] - 0.05, 5000),
        orientation: { pitch: Cesium.Math.toRadians(-35) }
    });
  } else {
    mapEl.style.display = 'block';
    cesiumEl.style.display = 'none';
    hudEl.classList.remove('visible');
    btn.classList.remove('active');
    if (state.isSimulating) toggleTwinSimulation();
  }
}

// ─── Digital Twin Simulation Logic ───
function toggleTwinSimulation() {
    const btn = document.getElementById('toggleSimBtn');
    const status = document.getElementById('twin-status');

    if (state.isSimulating) {
        state.isSimulating = false;
        if (state.socket) state.socket.close();
        btn.innerText = "START SIM";
        btn.classList.remove('active');
        status.innerText = "Simulation Paused";
        return;
    }

    const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
    const wsHost = window.location.hostname || "localhost";
    state.socket = new WebSocket(wsProtocol + wsHost + ":8001/ws/simulate");
    state.isSimulating = true;
    btn.innerText = "STOP SIM";
    btn.classList.add('active');
    status.innerText = "Syncing with PDE Engine...";

    state.socket.onopen = () => {
        state.socket.send(JSON.stringify({
            lat: CONFIG.center[1], lon: CONFIG.center[0], 
            wind_u: 8.0, wind_v: 3.0,
            interventions: state.interventions
        }));
    };

    state.socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        status.innerText = "Streaming Physics Data";
        if (data.polygons && data.polygons.length > 0) {
            updateFireEntity(data.polygons[0]);
        }
        document.getElementById('sim-time').innerText = "+" + data.time_elapsed + " mins";
    };
    
    state.socket.onerror = (e) => {
        console.error("WS Error", e);
        status.innerText = "Connection Failed (Port 8001)";
        state.isSimulating = false;
    };
}

function updateFireEntity(coords) {
    if (!state.fireEntity) {
        state.fireEntity = state.cesium.entities.add({
            name: 'Active Surface Fire',
            polygon: {
                hierarchy: new Cesium.CallbackProperty(() => {
                    return state.fireCoordinates.length > 2 ? new Cesium.PolygonHierarchy(
                        state.fireCoordinates.map(c => Cesium.Cartesian3.fromDegrees(c.lon, c.lat))
                    ) : null;
                }, false),
                material: Cesium.Color.ORANGERED.withAlpha(0.6),
                outline: true, outlineColor: Cesium.Color.YELLOW,
                heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
            }
        });
    }
    state.fireCoordinates = coords.map(c => ({ lon: c[0], lat: c[1] }));
}

function setTwinIntervention(type) {
    state.currentInterType = type;
    document.getElementById('lineBtn').classList.toggle('active', type === 'FIRELINE');
    document.getElementById('igniteBtn').classList.toggle('active', type === 'BACKFIRE');
}

function clearTwinInterventions() {
    state.interventions = [];
    state.cesium.entities.values.filter(e => e.name === 'Intervention').forEach(e => state.cesium.entities.remove(e));
    state.currentInterType = null;
}

function updateClock() {
  document.getElementById('liveTime').textContent = new Date().toLocaleTimeString('en-IN', { hour12: false, timeZone: 'Asia/Kolkata' }) + ' IST';
}

init();
</script>
</body>
</html>
