name: CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check src/ scripts/ tests/ --select E,W,F

  ops-static:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install minimal deps for entrypoint resolution
        run: |
          pip install --upgrade pip
          # Just enough for argparse + Python imports — not the full ML stack
          pip install pandas numpy lightgbm scikit-learn pyarrow geopandas \
                      shapely pyproj scipy ee-extra
      - name: Run static operational checks
        run: python scripts/ci_static_ops_checks.py

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=term-missing \
            -k "not test_model_backbone and not test_presto and not test_vanaagni"
      - name: Check coverage threshold
        run: |
          pytest tests/test_h3_index.py tests/test_spatial_db.py tests/test_lonboard_layers.py \
            --cov=src/utils --cov=src/viz --cov-fail-under=70 --tb=short -q

  build-tiles:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build tile assets
        run: python scripts/build_pmtiles.py --output-dir data/tiles
      - name: Upload tile artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tile-assets
          path: data/tiles/
          retention-days: 30