name: Daily Fire Alert Pipeline

on:
  schedule:
    # 00:30 UTC = 06:00 AM IST (daily)
    - cron: '30 0 * * *'
  workflow_dispatch:  # manual trigger

permissions:
  contents: write

jobs:
  fire-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev
          pip install numpy pandas pyarrow requests scipy lightgbm scikit-learn \
                      geopandas shapely pyproj rasterio fiona pyyaml joblib

      - name: Run Daily Fire Alert Pipeline
        # Pipeline auto-fetches live weather from Open-Meteo API (free, no key needed)
        run: python scripts/daily_fire_alert.py
        env:
          PYTHONPATH: .
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Run Prithvi burn scar confirmation
        if: ${{ secrets.EARTHDATA_USERNAME != '' }}
        run: |
          pip install earthaccess terratorch torch torchvision
          python scripts/nrt_alert_pipeline.py --date $(date -u +%Y-%m-%d) --confirm-burns
        env:
          PYTHONPATH: .
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        continue-on-error: true

      - name: Validate freshly-produced artefacts
        # Portal-less validation: Phases 1-2 (JSON schema + ops alerts
        # decoration) + Phase 5 (daily pipeline wiring) + Phase 6 (drift+
        # validation logs). Full Phase 3-4 requires a running portal and is
        # intentionally skipped in CI — those are covered by
        # scripts/test_operational_pipeline.py when the portal runs locally.
        run: python scripts/ci_static_ops_checks.py
        env:
          PYTHONPATH: .
        continue-on-error: true  # don't block commit on validation noise

      - name: Commit updated alerts
        run: |
          git config user.name "Van Suraksha Bot"
          git config user.email "vansuraksha-bot@users.noreply.github.com"
          git add data_lake/alerts/ data_lake/fire_weather/ outputs/dashboard_feed/ outputs/predictive_fire_risk/risk_map_*.csv
          git diff --staged --quiet || git commit -m "alert: $(date -u +%Y-%m-%d) daily fire alert update"
          git push
