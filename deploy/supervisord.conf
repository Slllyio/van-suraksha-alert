[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
stdout_logfile=/app/logs/cron_supervisor.log
stderr_logfile=/app/logs/cron_supervisor_err.log

[program:portal]
command=python dashboard/portal/dashboard_server.py --port 8787 --base-dir /app
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/portal.log
stderr_logfile=/app/logs/portal_err.log

[program:streamlit]
command=streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/streamlit.log
stderr_logfile=/app/logs/streamlit_err.log
